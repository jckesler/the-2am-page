<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 2AM Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a war-room board. Left column is the live scene; right rail is the status board and incident log. Stacks on phones. */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1c1a19; --muted:#6a6460; --line:#dcd6d0;
  --red:#cc0000; --red-soft:#fbe6e6; --aqua:#00796b; --aqua-soft:#e2f2ef; --amber:#a35a00; --amber-soft:#fbefdc;
  --good:#2e7d4f; --good-soft:#e3f2e8; --shadow:0 1px 0 rgba(0,0,0,.04);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.tl{border-top:1px solid var(--line);background:var(--bg);padding:12px 22px 14px}
.tl .eyebrow{display:block;margin-bottom:8px}
.tl-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(34px,1fr);list-style:none;margin:0;padding:0}
.tl-pt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;line-height:15px;color:var(--muted);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-day{height:15px;font-weight:600;color:var(--ink)}
.tl-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--panel);position:relative;z-index:1}
.tl-pt::before,.tl-pt::after{content:"";position:absolute;top:24px;width:50%;border-top:2px solid var(--line)}
.tl-pt::before{left:0}.tl-pt::after{right:0}
.tl-pt:first-child::before,.tl-pt:last-child::after{display:none}
.tl-pt.jump::before{border-top-style:dashed}
.tl-pt.done::before,.tl-pt.done::after,.tl-pt.now::before{border-top-color:var(--ink)}
.tl-pt.done .tl-dot{background:var(--ink);border-color:var(--ink)}
.tl-pt.now .tl-dot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.tl-pt.now .tl-rel{color:var(--red);font-weight:600}
@media (max-width:480px){.tl{padding:12px 12px 14px}.tl-pt{font-size:10px}}
.credit{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
a{color:var(--aqua)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.01em}
.brand .eyebrow{color:var(--red)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
.linkbtn:hover{border-color:var(--ink);color:var(--ink)}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.intro .lede{font-size:19px;max-width:60ch}
.intro h2{font-size:44px;margin:6px 0 14px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.rules ul{margin:8px 0 0;padding-left:18px}
.rules li{margin:6px 0}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.case:hover{border-color:var(--ink)}
.case h3{font-size:21px}
.case p{margin:0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:600;font-size:16px}
.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:13px;color:var(--muted)}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scene-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--red);font-variant-numeric:tabular-nums}
.step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scene-body{padding:20px 22px 24px}
.scene-body h2{font-size:30px;margin-bottom:10px}
.scene-body p{margin:0 0 12px;max-width:68ch}
.inject{border-left:4px solid var(--ink);background:var(--bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:4px 0 16px;font-size:15px}
.inject .eyebrow{display:block;margin-bottom:2px}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.choice .k{font-family:var(--f-mono);font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0;color:var(--muted)}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--ink)}
.result{margin-top:18px;border-radius:10px;padding:16px 18px;border:1px solid var(--line)}
.result.best{background:var(--good-soft);border-color:var(--good)}
.result.ok{background:var(--amber-soft);border-color:var(--amber)}
.result.poor{background:var(--red-soft);border-color:var(--red)}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.best .verdict{color:var(--good)} .ok .verdict{color:var(--amber)} .poor .verdict{color:var(--red)}
.result p{margin:6px 0 0}
.lesson{font-size:14px;color:var(--muted);margin-top:8px!important}
.result .primary{margin-top:14px}
/* rail */
.rail{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.board h3{font-size:18px;margin-bottom:10px}
.co{font-weight:600}
.co-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:13px}
.meter .lab b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:320px;overflow:auto}
.log li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .empty{display:block;color:var(--muted);font-style:italic}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* end */
.end h2{font-size:40px;margin:6px 0 10px}
.score{font-family:var(--f-mono);font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.debrief{display:grid;gap:10px;margin-top:10px}
.dl{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:12px 14px}
.dl.best{border-left-color:var(--good)} .dl.ok{border-left-color:var(--amber)} .dl.poor{border-left-color:var(--red)}
.dl .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.dl p{margin:6px 0 0;font-size:15px}
.real{background:var(--aqua-soft);border:1px solid var(--aqua);border-radius:10px;padding:16px 18px;margin-top:22px}
.real h3{font-size:22px;color:var(--aqua);margin-bottom:6px}
.real ul{margin:6px 0 0;padding-left:18px}
.real li{margin:6px 0}
.sec{margin-top:28px}
.sec>h3{font-size:24px;margin-bottom:8px}
@media (max-width:860px){.game,.intro{grid-template-columns:minmax(0,1fr)}.rail{position:static}.cases,.grid2{grid-template-columns:minmax(0,1fr)}.intro h2{font-size:34px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><h1>The 2AM Page</h1><span class="eyebrow">Incident response tabletop</span></div>
    <button class="linkbtn" id="homeBtn" hidden>New scenario</button>
  </header>
  <main id="app"></main>
  <footer class="credit">&copy; 2026 Chuck Kesler &middot; Licensed under <a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license noopener" target="_blank">CC BY-NC 4.0</a></footer>
</div>

<script>
(function(){
"use strict";
var M = {dis:'Business disruption', exp:'Legal exposure', tru:'Customer trust'};

/* ---------- scenarios ---------- */
var S = [];

/* A: health system, remote access without MFA, ransomware */
S.push({
 id:'harbor', name:'Harbor Ridge Health', sector:'Regional health system · Norfolk, Virginia',
 blurb:'Three hospitals, forty clinics, and a remote-access portal that a few vendors still log in to with just a password.',
 tag:'HIPAA', start:{dis:25,exp:20,tru:75},
 steps:[
 {clock:'Mon 05:52', title:'The page', text:function(){return '<p>The night charge nurse at the main hospital calls the help desk: the electronic health record is crawling. Twenty minutes later, an on-call engineer finds files on three servers renamed with a strange extension and a note on each one.</p><div class="inject"><span class="eyebrow">Note found on the servers</span>"Your network is encrypted. We also have 600 GB of your data. Contact us within 72 hours."</div><p>You are the security manager on call. What do you do first?</p>';},
  choices:[
   {t:'Declare an incident, start the call tree: incident commander, the insurer\'s hotline, then outside counsel.', v:'best', fx:{dis:0,exp:-5,tru:0}, set:{declared:1,log:1},
    r:'The plan kicks in. The insurer\'s claims team gives you a panel law firm, which retains a forensics firm the policy will pay for. Someone opens an incident log at 06:14.',
    l:'Declaring is a decision someone owns, and the insurer often decides which firms it will pay for.', ref:'The plan and the team · Triage and declaring'},
   {t:'Send an all-staff email telling everyone to shut down their computers.', v:'ok', fx:{dis:10,exp:0,tru:0},
    r:'Many people never see it, because the email system is one of the things running slowly. The ones who do see it shut down machines that forensics later wishes it could have examined.',
    l:'Containment matters, but if the attacker may be in your systems, those systems are a poor way to coordinate.', ref:'Preparation'},
   {t:'Email the address in the note to find out what they want.', v:'poor', fx:{dis:0,exp:15,tru:0},
    r:'The attackers reply within minutes, now knowing they have your attention. Counsel and the insurer are not happy to learn about it at 09:00.',
    l:'Never negotiate directly. Contact goes through a specialist, with the insurer and counsel involved.', ref:'Ransomware decisions'},
   {t:'Wait an hour to be sure it\'s real before waking anyone up.', v:'poor', fx:{dis:15,exp:5,tru:-5},
    r:'In that hour, encryption spreads to the scheduling system and two clinic file servers.',
    l:'Declaring too late is the more common mistake, and it can cost days.', ref:'Triage and declaring'}
  ]},
 {clock:'Mon 06:40', title:'Where to talk', text:function(){return '<p>The response team is assembling. The hospital runs email and chat through the same identity system the attacker may have used. People are already messaging each other in the usual team chat.</p><p>How does the response team communicate?</p>';},
  choices:[
   {t:'Move to the out-of-band phone bridge and the separate messaging accounts set up last year.', v:'best', fx:{exp:-5}, set:{oob:1},
    r:'The bridge works. Later, forensics confirms the attacker had read access to several mailboxes, including IT\'s.',
    l:'Assume email and chat may be compromised, and have another channel set up ahead of time.', ref:'Preparation'},
   {t:'Keep using company chat, but avoid naming the ransomware group.', v:'poor', fx:{exp:10,dis:5},
    r:'The attacker reads the team\'s containment plans and disables two accounts before IT can lock them down.',
    l:'An attacker who can read your planning can stay one step ahead of it.', ref:'Preparation'},
   {t:'Everyone texts the incident commander on personal phones.', v:'ok', fx:{dis:5},
    r:'It\'s probably out of the attacker\'s reach, but the commander is buried in fifty threads, two decisions get made twice, and counsel later has to collect texts from personal phones.',
    l:'Out-of-band only helps if it was planned, with a roster and a place to keep the log.', ref:'Preparation'}
  ]},
 {clock:'Mon 07:30', title:'Keeping patients safe', text:function(){return '<p>The emergency department can\'t see patient histories, and lab results aren\'t flowing. Clinical leaders ask the incident commander what they should do.</p>';},
  choices:[
   {t:'Activate downtime procedures: paper charting, runners for lab results, and divert ambulances if the ED can\'t cope.', v:'best', fx:{dis:-10,tru:5}, set:{bcp:1},
    r:'It\'s slow and messy, but care continues. The plan was tested in a tabletop last spring, so people know where the paper forms are.',
    l:'Recovery runs alongside the business continuity plan, which NIST\'s Revision 3 ties to the incident response plan.', ref:'Eradication and recovery'},
   {t:'Keep using the systems that still work and hope the rest come back soon.', v:'poor', fx:{dis:15,tru:-10},
    r:'Two systems that "still work" were already infected. A medication order is delayed for hours.',
    l:'Continuity has to be planned, not improvised from whatever is still running.', ref:'Eradication and recovery'},
   {t:'Ask IT for an estimate of when everything will be back before deciding anything.', v:'ok', fx:{dis:10},
    r:'IT can\'t give one yet. The decision gets made at noon instead of at 07:30.',
    l:'You rarely get a reliable restore estimate in the first hours, so continuity decisions can\'t wait for one.', ref:'Eradication and recovery'}
  ]},
 {clock:'Mon 10:15', title:'Rebuild now?', text:function(){return '<p>The infrastructure lead has good news: last week\'s backups look intact. She wants to wipe the encrypted servers and start restoring right away.</p>';},
  choices:[
   {t:'First capture forensic images of the affected servers, arranged through counsel\'s forensics firm, and check the backups are clean.', v:'best', fx:{dis:5,exp:-10}, set:{images:1},
    r:'It costs most of a day. The images later show exactly which folders were copied out, and when.',
    l:'Preserve, then rebuild. Wiping first destroys the evidence of what was taken.', ref:'Preserving evidence'},
   {t:'Wipe and restore immediately, since patients come first.', v:'poor', fx:{dis:-10,exp:15}, set:{noimages:1},
    r:'Systems come back faster. But nobody can now say which patient files the attackers copied, and the attacker\'s way in is still open.',
    l:'Rebuilding without evidence and without checking the backups can cost you twice.', ref:'Preserving evidence · Eradication and recovery'},
   {t:'Image only the most important server, then restore everything else.', v:'ok', fx:{exp:5}, set:{partial:1},
    r:'You keep some evidence, but the copied data turns out to have gone through a server you didn\'t image.',
    l:'Counsel and forensics should decide what to preserve, not the restore schedule.', ref:'Preserving evidence'}
  ]},
 {clock:'Mon 16:30', title:'How they got in', text:function(){return '<p>Forensics finds the way in: a vendor account on the remote-access portal, protected only by a password that showed up in a credentials dump last year. The attacker first logged in nine days ago.</p>';},
  choices:[
   {t:'Disable the portal for all vendors, revoke active sessions, rotate the credentials the attacker touched, and turn on MFA before reopening it.', v:'best', fx:{dis:5,exp:-10}, set:{contained:1},
    r:'The attacker\'s other footholds go quiet. A few vendors complain about the outage; nobody gets back in.',
    l:'Containment today includes sessions, credentials and third-party access, not only machines.', ref:'Containment'},
   {t:'Reset that vendor\'s password and move on.', v:'poor', fx:{exp:15,dis:10},
    r:'The attacker had already created two more accounts. They\'re back the next night.',
    l:'Resetting one password rarely evicts an attacker who has had nine days inside.', ref:'Containment'},
   {t:'Rebuild every computer in all three hospitals before doing anything else.', v:'poor', fx:{dis:20},
    r:'It takes weeks, and the portal stays open the whole time.',
    l:'Rebuilding has its place, but close the door they used first.', ref:'Containment · Eradication and recovery'}
  ]},
 {clock:'Tue 09:00', title:'The demand', text:function(st){return '<p>The attackers name their price: $4.5 million in cryptocurrency for a decryption key and a promise to delete the stolen data. '+(st.noimages&&!st.contained?'Your restored servers were reinfected overnight through the attacker\'s still-open way in, so the CEO is under pressure to just pay.':'Restores from clean backups are under way, with IT staff on loan from two neighboring health systems that offered to help, but some clinic systems will take a week.')+'</p><p>The CEO wants a recommendation by noon.</p>';},
  choices:[
   {t:'Bring in the insurer, counsel and a specialist negotiator; check the group against US sanctions; brief the FBI; weigh it against what the backups can restore.', v:'best', fx:{exp:-10}, set:{le:1},
    r:'The sanctions check raises questions about the group, and the backups can restore almost everything. Leadership decides not to pay, with counsel\'s advice on record.',
    l:'Decide with the insurer and counsel, use a specialist, check sanctions, and engage law enforcement.', ref:'Ransomware decisions'},
   {t:'Pay quickly so the stolen data gets deleted before it leaks.', v:'poor', fx:{exp:20,tru:-5},
    r:'You pay. Weeks later, some of the data turns up for sale anyway, and nobody checked whether the group was sanctioned.',
    l:'Paying doesn\'t guarantee stolen data is deleted, and paying a sanctioned group can itself be illegal.', ref:'Ransomware decisions'},
   {t:'Refuse on principle and stop all contact, without checking what the backups can restore.', v:'ok', fx:{dis:10},
    r:'Refusing may well be right, but nobody checked whether "no" was realistic. Two clinics stay down for an extra week.',
    l:'Whether you can say no depends on your backups, which is why the decision belongs in a tabletop before any incident.', ref:'Ransomware decisions'}
  ]},
 {clock:'Thu 14:00', title:'Is it a breach?', text:function(st){return '<p>'+(st.noimages?'Without forensic images, the team can\'t say which records were copied. Counsel says you may have to assume the worst for every patient on those servers.':st.partial?'Forensics can confirm some of what was copied, but not everything that passed through the server you didn\'t image. Counsel says you may have to assume the worst for some patients. What forensics can confirm so far: unencrypted files with names, dates of birth, diagnoses and insurance numbers for at least 120,000 patients.':'Forensics confirms the attackers copied unencrypted files with names, dates of birth, diagnoses and insurance numbers for about 180,000 patients.')+'</p><p>Counsel asks for your read before the privacy officer\'s meeting.</p>';},
  choices:[
   {t:'Treat it as a reportable HIPAA breach: individuals without unreasonable delay and no later than 60 days after discovery, HHS at the same time (500 or more people), and media in each state where more than 500 residents are affected.', v:'best', fx:{exp:-10,tru:5}, set:{reported:1},
    r:'The privacy officer agrees and starts the notification workplan. The clock runs from discovery, not from the final report.',
    l:'Health data has its own federal rules, and the HHS and media thresholds are two different tests.', ref:'Breach determination · Notification clocks'},
   {t:'It isn\'t reportable: the files were encrypted, and encrypted data is exempt.', v:'poor', fx:{exp:25,tru:-15},
    r:'Counsel stops you. HIPAA\'s safe harbor covers health information your organization encrypted to HHS\'s standard, with the key kept safe. These files were copied in the clear. And under HHS guidance, ransomware encrypting your patients\' data is itself presumed to be a breach unless a risk assessment shows a low probability of compromise.',
    l:'The encryption question asks whether the stolen data was protected, not whether the attacker encrypted your copy.', ref:'Breach determination'},
   {t:'Wait for the final forensic report before deciding.', v:'ok', fx:{exp:15},
    r:'The final report takes seven weeks. The 60 days started at discovery, and HHS expects notice without unreasonable delay, so the team is rushing and still has to explain the wait.',
    l:'HIPAA\'s clock starts at discovery, or when you should have discovered it, not when the report is done.', ref:'Notification clocks'}
  ]},
 {clock:'+2 weeks', title:'The letter from OCR', text:function(st){return '<p>The HHS Office for Civil Rights opens an investigation and asks for a long list of evidence: your risk analysis, access controls on the portal, the timeline, and every decision you made, due in about two weeks.</p>'+(st.log?'<p>Your incident log has been running since 06:14 on Monday.</p>':'<p>Nobody kept a formal log; the timeline is scattered across chats, texts and emails.</p>');},
  choices:[
   {t:function(st){return st.log?'Build the response from the incident log, the documented decisions, and counsel\'s file, reviewed by counsel before it goes out.':'Rebuild the timeline from chats, emails and memory, and have counsel review it before it goes out.';}, v:function(st){return st.log?'best':'ok';}, fx:{exp:-10},

/* ---------- engine ---------- */
var app = document.getElementById('app'), homeBtn = document.getElementById('homeBtn');
var st, sc, si, picks, meters;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function val(x){return typeof x==='function'?x(st):x;}
function clamp(n){return Math.max(0,Math.min(100,n));}

function intro(){
  homeBtn.hidden = true;
  var h = '<section class="intro"><div><span class="eyebrow">About 15 minutes</span><h2>Your phone buzzes. Something is wrong.</h2><p class="lede">You\'re on call when an incident begins. Make the calls a response team makes, from the first hour to the review a month later, and see how each one plays out.</p><div class="row"><button class="primary" id="go">Start a random scenario</button><span class="note">Each play picks one of three companies.</span></div></div>'+
  '<aside class="rules"><h3>How it works</h3><ul><li>Each scene gives you a situation and two to four choices. There\'s no timer.</li><li>Your choices move three meters: business disruption, legal exposure and customer trust.</li><li>Every decision appears in the decision log on the right, timestamped as it would be in a real response.</li><li>At the end, a debrief explains each decision and names the incident response topic behind it.</li></ul></aside></section>'+
  '<section class="sec"><h3>Or pick a scenario</h3><div class="cases">';
  S.forEach(function(s,i){h+='<button class="case" data-i="'+i+'"><span class="tag">'+esc(s.tag)+'</span><h3>'+esc(s.name)+'</h3><p>'+esc(s.sector)+'</p><p>'+esc(s.blurb)+'</p></button>';});
  h+='</div><p class="note" style="margin-top:14px">The companies are invented. Each scenario is modeled on real incidents, which the debrief describes.</p></section>';
  app.innerHTML = h;
  document.getElementById('go').onclick = function(){start(Math.floor(Math.random()*S.length));};
  [].forEach.call(app.querySelectorAll('.case'),function(b){b.onclick=function(){start(+b.getAttribute('data-i'));};});
  window.scrollTo(0,0);
}

function start(i){
  sc = S[i]; si = 0; st = {}; picks = [];
  meters = {dis:sc.start.dis, exp:sc.start.exp, tru:sc.start.tru};
  homeBtn.hidden = false; scene();
}

function meterHTML(k){
  var v = meters[k], good = (k==='tru') ? v>=60 : v<=40, bad = (k==='tru') ? v<40 : v>65;
  var col = good ? 'var(--good)' : bad ? 'var(--red)' : 'var(--amber)';
  return '<div class="meter"><div class="lab"><span>'+M[k]+'</span><b>'+v+'</b></div><div class="bar" role="progressbar" aria-label="'+M[k]+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v+'"><i style="width:'+v+'%;background:'+col+'"></i></div></div>';
}
function rail(){
  var h = '<aside class="rail"><div class="board"><div class="eyebrow">Status board</div><div class="co" style="margin-top:6px">'+esc(sc.name)+'</div><div class="co-sub">'+esc(sc.sector)+'</div>'+meterHTML('dis')+meterHTML('exp')+meterHTML('tru')+'</div>';
  h += '<div class="board"><h3>Decision log</h3><ul class="log" aria-live="polite">';
  if(!picks.length) h += '<li><span class="empty">No entries yet.</span></li>';
  picks.forEach(function(p){
    var c = p.v==='best'?'var(--good)':p.v==='ok'?'var(--amber)':'var(--red)';
    h += '<li><time>'+esc(p.clock)+'</time><span><span class="dot" style="background:'+c+'"></span>'+esc(p.short)+'</span></li>';
  });
  return h + '</ul></div></aside>';
}
function shortOf(t){ var s = t.split(/[.:;]/)[0]; return s.length>70 ? s.slice(0,68)+'…' : s; }

/* Timeline strip at the bottom of each scene: elapsed time since the page, with day changes. */
function timeline(){
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], base = null, prev = -1, add = 0, lastDay = '', lastRel = '';
  var h = '<div class="tl"><span class="eyebrow">Incident timeline</span><ol class="tl-track">';
  sc.steps.forEach(function(s,i){
    var c = val(s.clock), m = /^(\w{3}) (\d\d):(\d\d)$/.exec(c), day = '', rel, jump = false;
    if(m){
      var abs = D.indexOf(m[1])*1440 + (+m[2])*60 + (+m[3]) + add;
      if(prev >= 0 && abs < prev){ add += 7*1440; abs += 7*1440; }
      prev = abs; if(base === null) base = abs;
      var e = abs - base;
      rel = e === 0 ? 'Start' : e < 60 ? '+'+e+'m' : e < 72*60 ? '+'+Math.round(e/60)+'h' : '+'+Math.round(e/1440)+'d';
      if(rel === lastRel){ var hh = Math.round(e/60); rel = '+'+Math.floor(hh/24)+'d'+(hh%24)+'h'; }
      lastRel = rel;
      if(m[1] !== lastDay){ day = m[1]; lastDay = m[1]; }
    } else {
      rel = c.replace(/ weeks?$/,' wk').replace(/ months?$/,' mo'); jump = true;
      if(lastDay !== 'Later'){ day = 'Later'; lastDay = 'Later'; }
    }
    var cls = i < si ? 'done' : i === si ? 'now' : 'next';
    var said = (cls==='done'?'done':cls==='now'?'current decision':'ahead');
    h += '<li class="tl-pt '+cls+(jump?' jump':'')+'" aria-label="Decision '+(i+1)+', '+esc(c)+', '+said+'"'+(cls==='now'?' aria-current="step"':'')+'><span class="tl-day" aria-hidden="true">'+esc(day)+'</span><span class="tl-dot" aria-hidden="true"></span><span class="tl-rel" aria-hidden="true">'+esc(rel)+'</span></li>';
  });
  return h + '</ol></div>';
}
function scene(){
  var step = sc.steps[si];
  var h = '<div class="game"><section class="scene"><div class="scene-head"><span class="clock">'+esc(val(step.clock))+'</span><span class="step">Decision '+(si+1)+' of '+sc.steps.length+'</span></div><div class="scene-body"><h2>'+esc(step.title)+'</h2>'+val(step.text)+'<div class="choices">';
  var order = step.choices.map(function(_,j){return j;});
  for(var q=order.length-1;q>0;q--){var w=Math.floor(Math.random()*(q+1)),tq=order[q];order[q]=order[w];order[w]=tq;}
  order.forEach(function(j,n){var c=step.choices[j];h+='<button class="choice" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+n)+'</span><span>'+esc(val(c.t))+'</span></button>';});
  h += '</div><div id="res"></div></div>'+timeline()+'</section>'+rail()+'</div>';
  app.innerHTML = h;
  [].forEach.call(app.querySelectorAll('.choice'),function(b){b.onclick=function(){choose(+b.getAttribute('data-j'));};});
  window.scrollTo(0,0);
}

function choose(j){
  var step = sc.steps[si], c = step.choices[j], v = val(c.v), r = val(c.r), ct = val(c.t), ck = val(step.clock);
  var fx = c.fx||{}; for(var k in fx){ meters[k] = clamp(meters[k] + fx[k]); }
  if(c.set) for(var f in c.set) st[f]=c.set[f];
  picks.push({clock:ck, title:step.title, t:ct, short:shortOf(ct), v:v, r:r, l:c.l, ref:c.ref});
  [].forEach.call(app.querySelectorAll('.choice'),function(b,i){b.disabled=true; if(+b.getAttribute('data-j')===j) b.classList.add('picked');});
  var lab = v==='best'?'Strong call':v==='ok'?'Partly right':'Costly call';
  var last = si===sc.steps.length-1;
  var res = document.getElementById('res');
  res.innerHTML = '<div class="result '+v+'" tabindex="-1"><span class="verdict">'+lab+'</span><p>'+esc(r)+'</p><p class="lesson">'+esc(c.l)+' <span class="eyebrow">'+esc(c.ref)+'</span></p><button class="primary" id="next">'+(last?'See how it ended':'Continue')+'</button></div>';
  var tmp = document.createElement('div'); tmp.innerHTML = rail(); var railEl = app.querySelector('.rail');
  railEl.querySelector('.board').innerHTML = tmp.querySelector('.board').innerHTML;
  railEl.querySelector('.log').innerHTML = tmp.querySelector('.log').innerHTML;
  var box = res.firstChild; box.focus({preventScroll:true}); box.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});
  document.getElementById('next').onclick = function(){ si++; if(si<sc.steps.length) scene(); else end(); };
}

function end(){
  var pts = picks.reduce(function(a,p){return a+(p.v==='best'?2:p.v==='ok'?1:0);},0), max = picks.length*2, pct = pts/max;
  var title, sub;
  if(pct>=0.8){title='Contained, and credible'; sub='You moved fast, kept the evidence, made the hard calls with the right people, and told the right people on time. It was still a hard week. Good responses usually are.';}
  else if(pct>=0.55){title='Recovered, with some scars'; sub='The organization got through it, but a few early decisions made the later ones harder. Look at which calls cost you, and when.';}
  else {title='Lessons learned the hard way'; sub='Most of what went wrong traces back to something that wasn\'t prepared, or a decision made too late or by the wrong people. That\'s what a tabletop is for: making these mistakes before they cost anything.';}
  var best = picks.filter(function(p){return p.v==='best';}).length;
  var h = '<div class="game"><section class="end"><span class="eyebrow">'+esc(sc.name)+' · after-action report</span><h2>'+title+'</h2><p class="lede" style="max-width:62ch">'+sub+'</p>';
  h += '<div class="grid2"><div class="stat"><div class="n">'+best+' / '+picks.length+'</div><div class="l">strong calls</div></div><div class="stat"><div class="n">'+meters.dis+'</div><div class="l">business disruption (lower is better)</div></div><div class="stat"><div class="n">'+meters.exp+'</div><div class="l">legal exposure (lower is better)</div></div><div class="stat"><div class="n">'+meters.tru+'</div><div class="l">customer trust (higher is better)</div></div></div>';
  h += '<div class="sec"><h3>Your decisions</h3><div class="debrief">';
  picks.forEach(function(p){ var lab = p.v==='best'?'Strong call':p.v==='ok'?'Partly right':'Costly call';
    h += '<div class="dl '+p.v+'"><div class="h"><span>'+esc(p.clock)+' · '+esc(p.title)+'</span><span>'+lab+' · '+esc(p.ref)+'</span></div><p><b>You chose:</b> '+esc(p.t)+'</p><p class="lesson" style="margin:6px 0 0;font-size:14px;color:var(--muted)">'+esc(p.l)+'</p></div>'; });
  h += '</div></div>';
  var R = sc.real; h += '<div class="real"><h3>'+esc(R.title)+'</h3><ul>';
  R.items.forEach(function(x){h+='<li>'+esc(x)+'</li>';});
  h += '</ul><p class="note" style="margin-top:8px">'+esc(R.note)+'</p>';
  if(R.links){ h += '<p class="note">Read more: '; h += R.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>';}).join(' · '); h += '</p>'; }
  h += '</div><div class="row"><button class="primary" id="again">Play another scenario</button><button class="linkbtn" id="same">Replay this one</button></div></section>'+rail()+'</div>';
  app.innerHTML = h;
  var cur = S.indexOf(sc);
  document.getElementById('again').onclick = function(){ var n; do{ n=Math.floor(Math.random()*S.length);}while(n===cur && S.length>1); start(n); };
  document.getElementById('same').onclick = function(){ start(cur); };
  window.scrollTo(0,0);
}

var armed = false;
homeBtn.onclick = function(){
  var inGame = picks && picks.length && si < sc.steps.length;
  if(inGame && !armed){ armed = true; homeBtn.textContent = 'Leave this scenario?'; setTimeout(function(){ armed = false; homeBtn.textContent = 'New scenario'; }, 4000); return; }
  armed = false; homeBtn.textContent = 'New scenario'; intro();
};
intro();
})();
</script>
